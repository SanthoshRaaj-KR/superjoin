  # --- the rounding case that breaks a fixed tolerance ----------------------

  - id: ar-p35-traded-goods-fy23
    doc: ar
    page: 35
    subject: Delhivery Limited
    metric: revenue from sale of traded goods
    value_raw: "16.54"
    canonical: 16540000
    unit: {dimension: currency, currency: INR, scale: million}
    period: FY2023
    qualifiers: {consolidation: consolidated}
    quote_contains: "16.54"
    note: >
      The deck reports this same line as 2 crore. Twenty-one percent apart, and
      both correct: one crore is the deck's entire precision at this magnitude.
      A fixed relative tolerance calls this a contradiction.

  - id: deck-p16-traded-goods-fy23
    doc: deck
    page: 16
    subject: Delhivery Limited
