  # --- case 2: a genuine contradiction --------------------------------------
  #
  # Same entity, same metric, same period, same modality, two institutions.
  # Nothing reconciles this and nothing should.

  - id: rbi-p16-gdp-fy26-projection
    doc: rbi
    page: 16
    subject: India
    metric: real GDP growth
    value_raw: "6.5"
    canonical: 6.5
    unit: {dimension: percent}
    period: FY2026
    modality: projection
    quote_contains: "real GDP growth for 2025-26 is projected at 6.5 per cent"

  - id: imf-p12-gdp-fy26-projection
    doc: imf
    page: 12
    subject: India
    metric: real GDP growth
    value_raw: "6.6"
    canonical: 6.6
    unit: {dimension: percent}
    period: FY2026
    modality: projection
    quote_contains: "Current 6.6"
    note: >
      From the revision table, where the "Current" row supersedes "July WEO
      6.4". The same page also says growth returns "to its potential rate of
      6.5 percent over the medium term" — a different metric, and an easy
      wrong pairing to make.

  # --- case 3b: reconciled by estimate vintage ------------------------------
  #
  # Same entity, same metric, same period. 6.4 against 6.5, and both correct:
  # the Survey quotes the first advance estimates published in January, the
  # other two report the year as it landed.

  - id: survey-p13-gdp-fy25-advance
    doc: survey
    page: 13
    subject: India
    metric: real GDP growth
    value_raw: "6.4"
    canonical: 6.4
    unit: {dimension: percent}
    period: FY2025
    modality: estimate
    qualifiers: {estimate_vintage: first advance estimates}
    quote_contains: "growth for FY25 is estimated to be 6.4 per cent"

  - id: rbi-p7-gdp-fy25-actual
    doc: rbi
    page: 7
    subject: India
    metric: real GDP growth
    value_raw: "6.5"
    canonical: 6.5
    unit: {dimension: percent}
    period: FY2025
    modality: actual
    quote_contains: "growth moderated to 6.5 per cent in 2024-25"

  - id: imf-p9-gdp-fy25-actual
    doc: imf
    page: 9
    subject: India
    metric: real GDP growth
    value_raw: "6.5"
    canonical: 6.5
    unit: {dimension: percent}
    period: FY2025
    modality: actual
    quote_contains: "real GDP grew by 6.5 percent in FY2024/25"
    note: >
      Writes the same twelve months as "FY2024/25" where the RBI writes
      "2024-25". Corroboration is impossible until those normalise.

  # --- case 3c: reconciled by time (interval closure) -----------------------

  - id: prospectus-p29-suvir-director
    doc: prospectus
    page: 29
    claim_type: state
    subject: Suvir Suren Sujan
    metric: Non-Executive Director
    value_text: Delhivery Limited
    valid_to_is_open: true
    quote_contains: "Suvir"
    note: >
      The 2022 prospectus knows of no end date. That is not a claim that he
      serves forever — it is an open interval, and the annual report closes it.

