# Gold set — claims.
#
# Hand-labelled from the source PDFs BEFORE the comparability gate exists, so
# the gate is built against a target rather than scored after the fact.
#
# Every entry carries `quote_contains`, a string that must appear in the raw
# text of the cited page. `python -m fkl.cli gold --verify` checks all of them
# against the PDFs, which makes this file self-validating: a wrong page number
# or a mistyped figure fails immediately instead of quietly becoming the
# standard that everything else is measured against.
#
# Canonical values are in base units — rupees, not millions — matching
# `claims.value_canonical`.

documents:
  prospectus: starter-datasets/delhivery/01-delhivery-prospectus-2022-excerpt.pdf
  ar: starter-datasets/delhivery/02-delhivery-annual-report-fy24-excerpt.pdf
  deck: starter-datasets/delhivery/03-delhivery-q4-fy24-earnings-presentation.pdf
  survey: starter-datasets/india-macroeconomy/01-india-economic-survey-2024-25-excerpt.pdf
  rbi: starter-datasets/india-macroeconomy/02-rbi-annual-report-2024-25-excerpt.pdf
  imf: starter-datasets/india-macroeconomy/03-imf-india-2025-article-iv-excerpt.pdf

claims:

  # --- case 1: one fact, three spellings, two documents ---------------------

  - id: ar-p35-revenue-consolidated
    doc: ar
    page: 35
    subject: Delhivery Limited
    metric: revenue from operations
    value_raw: "81,415.38"
    canonical: 81415380000
    unit: {dimension: currency, currency: INR, scale: million}
    period: FY2024
    qualifiers: {consolidation: consolidated}
    quote_contains: "Revenue from contracts with customers"
    note: >
      The unit is never stated beside the number. It is declared once at page
      scope as "(All amounts in Indian Rupees in million...)", which is the
      whole reason context inheritance exists.

  - id: deck-p5-revenue-fy24
    doc: deck
    page: 5
    subject: Delhivery Limited
    metric: revenue from operations
    value_raw: "8,142"
    canonical: 81420000000
    unit: {dimension: currency, currency: INR, scale: crore}
    period: FY2024
    qualifiers: {consolidation: consolidated}
    quote_contains: "₹8,142 Cr"
    note: >
      Same fact as ar-p35-revenue-consolidated, in crore rather than million.
      0.006% apart, which is the deck rounding to the nearest crore.

  - id: ar-p35-total-income-fy24
    doc: ar
    page: 35
