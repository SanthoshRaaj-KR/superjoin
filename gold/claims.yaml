  # --- case 4: the extraction failure, kept as a case -----------------------

  - id: deck-p8-ptl-freight-revenue-fy24
    doc: deck
    page: 8
    subject: Delhivery Limited
    metric: PTL freight revenue
    value_raw: "1,517"
    canonical: 15170000000
    unit: {dimension: currency, currency: INR, scale: crore}
    period: FY2024
    quote_contains: "1,517"
    requires_figures: true
    note: >
      Printed inside a chart. The number survives text extraction; the binding
      to its series and year does not, so text-only extraction cannot attach
      it and the claim is expected to be absent unless --figures is used.
